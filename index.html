<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Big Navigators - Home</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
                    url('image1.jpg');
        background-size: cover;
        background-position: center;
    }
    header {
        background-color: #0b74de;
        text-align: center;
    }
    header img {
        height: 70px;
        margin: 0 auto;
        display: block;
    }
    .form-container {
        max-width: 500px;
        margin: 40px auto;
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    h2 {
        text-align: center;
        color: #0b74de;
    }
    label {
        display: block;
        margin-top: 10px;
        font-weight: bold;
    }
    input, select {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 16px;
    }
    button {
        width: 100%;
        padding: 12px;
        background: #0b74de;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 18px;
        cursor: pointer;
        margin-top: 20px;
    }
    button:hover {
        background: #095bb5;
    }
    #resultBox {
        margin-top: 20px;
        padding: 15px;
        background: #eaf6ff;
        border-left: 5px solid #0b74de;
        display: none;
    }
    footer {
        margin-top: auto;
        background-color: #0b74de;
        color: white;
        text-align: center;
        padding: 15px;
        font-size: 14px;
    }
</style>
</head>

<body>

<header>
    <img src="bnlogo.jpg" alt="Company Logo">
</header>

<div class="form-container">
    <h2 id="formTitle">CALCULATOR FOR CIF LCL SHIPMENT FROM SHANGHAI TO INDIA</h2>

    <form id="contactForm" action="https://formspree.io/f/xrbygqyq" method="POST">

        <!-- LANGUAGE SWITCH -->
        <label id="labelLanguage" for="languageSelect">Choose Language / 选择语言</label>
        <select id="languageSelect">
            <option value="en">English</option>
            <option value="zh">中文</option>
        </select>

        <label id="labelName">Contact Name</label>
        <input type="text" id="name" name="name" required>

        <label id="labelEmail">Email Address</label>
        <input type="email" id="email" name="email" required>

        <label id="labelPhone">Phone Number</label>
        <input type="tel" id="phone" name="phone" required pattern="[0-9]{10,15}">

        <label id="labelCompany">Company Name</label>
        <input type="text" id="company" name="company" required>

        <label id="labelCBM">Enter CBM</label>
        <input type="number" id="cbm" name="cbm" required step="0.01">

        <label id="labelWeight">Enter Weight (Tonne)</label>
        <input type="number" id="weight" name="weight" required step="1">

        <label id="labelLocation">Location</label>
        <select id="location" name="location" required>
            <option value="">-- Select Location --</option>
            <option value="chennai">Chennai</option>
            <option value="nhava sheva">Nhava Sheva</option>
        </select>

        <label id="labelCargo">Cargo Type</label>
        <select id="cargo" name="cargo" required>
            <option value="">-- Select Cargo Type --</option>
            <option value="general cargo">General Cargo</option>
            <option value="dg cargo">DG Cargo</option>
        </select>

        <!-- Hidden Fields -->
        <input type="hidden" id="originCharges" name="Origin Charges">
        <input type="hidden" id="destinationdeliverycharges" name="Destination Delivery Charges">
        <input type="hidden" id="destinationcfscharges" name="Destination CFS Charges">
        <input type="hidden" id="destinationCharges" name="Destination Charges">
        <input type="hidden" id="thankyoumessage" name="Thank You Message">
        <input type="hidden" id="submittedCBM" name="Submitted CBM">
        <input type="hidden" id="submittedWeight" name="Submitted Weight">

        <button type="submit" id="submitButton">Submit</button>
    </form>

    <div id="resultBox"></div>
</div>

<footer id="footerText">
    <p>DG Acceptance Class 2.2/3/4.1/6.1/8/9*</p>
    <p>📦 Transit Time: Shanghai to Chennai – 20 Days | Shanghai to Nhava Sheva – 22 Days</p>
    <p>&copy; 2025 Big Navigators Pvt Ltd. All Rights Reserved.</p>
</footer>

<script>
/* ------------------- TRANSLATIONS ------------------- */
const translations = {
    en: {
        title: "CALCULATOR FOR CIF LCL SHIPMENT FROM SHANGHAI TO INDIA",
        language: "Choose Language",
        name: "Contact Name",
        email: "Email Address",
        phone: "Phone Number",
        company: "Company Name",
        cbm: "Enter CBM",
        weight: "Enter Weight (Tonne)",
        location: "Location",
        cargo: "Cargo Type",
        submit: "Submit",
        locationOptions: { chennai: "Chennai", "nhava sheva": "Nhava Sheva" },
        cargoOptions: { "general cargo": "General Cargo", "dg cargo": "DG Cargo" },

        totalOrigin: "Total Origin Charges: RMB",
        destinationdeliverycharges: "Destination Delivery Charges: INR",
        destinationcfscharges: "Destination CFS Charges: INR",
        totalDest: "Total Destination Charges: INR",

        note: "Note: Destination Charges (including GST)",
        excl: "Above charges are exclusive of ocean freight",
        check: "Please check with our local agent for ocean freight",

        success: "✅ Your form was submitted successfully!",
        fail: "❌ There was a problem sending your form."
    },

    zh: {
        title: "上海至印度 CIF LCL 货运计算器",
        language: "选择语言",
        name: "联系人姓名",
        email: "电子邮件地址",
        phone: "电话号码",
        company: "公司名称",
        cbm: "输入体积 (CBM)",
        weight: "输入重量 (吨)",
        location: "目的港",
        cargo: "货物类型",
        submit: "提交",
        locationOptions: { chennai: "钦奈", "nhava sheva": "纳瓦谢瓦" },
        cargoOptions: { "general cargo": "普通货物", "dg cargo": "危险品货物" },

        totalOrigin: "起运地费用: RMB",
        destinationdeliverycharges: "目的地派送费用: INR",
        destinationcfscharges: "目的地仓库费用 (CFS): INR",
        totalDest: "目的地总费用: INR",

        note: "备注：目的地费用已包含 18% GST",
        excl: "以上费用不含海运费",
        check: "请与我们的当地代理确认海运费",

        success: "✅ 表单提交成功！",
        fail: "❌ 表单提交失败，请稍后重试。"
    }
};

let currentLang = "en";

/* ------------------- LANGUAGE SWITCH ------------------- */
function setLanguage(lang) {
    const t = translations[lang];

    document.getElementById("formTitle").textContent = t.title;
    document.getElementById("labelLanguage").textContent = t.language;
    document.getElementById("labelName").textContent = t.name;
    document.getElementById("labelEmail").textContent = t.email;
    document.getElementById("labelPhone").textContent = t.phone;
    document.getElementById("labelCompany").textContent = t.company;
    document.getElementById("labelCBM").textContent = t.cbm;
    document.getElementById("labelWeight").textContent = t.weight;
    document.getElementById("labelLocation").textContent = t.location;
    document.getElementById("labelCargo").textContent = t.cargo;
    document.getElementById("submitButton").textContent = t.submit;

    // Dropdown translations
    const locSel = document.getElementById("location");
    locSel.options[1].textContent = t.locationOptions.chennai;
    locSel.options[2].textContent = t.locationOptions["nhava sheva"];

    const cargoSel = document.getElementById("cargo");
    cargoSel.options[1].textContent = t.cargoOptions["general cargo"];
    cargoSel.options[2].textContent = t.cargoOptions["dg cargo"];
}

document.getElementById("languageSelect").addEventListener("change", function () {
    currentLang = this.value;
    setLanguage(currentLang);
});

setLanguage("en");

/* ------------------- FORM CALCULATION + SUBMIT ------------------- */
document.getElementById("contactForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const cbm = parseFloat(document.getElementById("cbm").value);
    const weight = parseInt(document.getElementById("weight").value);
    const location = document.getElementById("location").value;
    const cargo = document.getElementById("cargo").value;

    if (!location || !cargo) {
        alert("Please select location and cargo type.");
        return;
    }

    const CW = Math.max(cbm, weight);
    let originCharges = 0;
    let destinationdeliverycharges = 0;
    let destinationcfscharges = 0;
    let destinationCharges = 0;

    if (cargo === "general cargo") {
        originCharges = (CW * 40) + 150;

        const F = (950 * CW) + 5500 + 7500;
        destinationdeliverycharges = F * 1.18;

        const destFactor = (location === "chennai" ? 3500 : 4500);
        const I = (380 * CW) + (destFactor * CW) + 3200;
        destinationcfscharges = I * 1.18;

    } else if (cargo === "dg cargo") {
        originCharges = (CW * 280) + 2210;

        const C = (1400 * CW) + 5500 + 7500;
        destinationdeliverycharges = C * 1.18;

        const W = (380 * CW) + (6200 * CW) + 4200;
        destinationcfscharges = W * 1.18;
    }

    destinationCharges = destinationdeliverycharges + destinationcfscharges;

    // Set hidden field values
    document.getElementById("originCharges").value = originCharges.toFixed(2);
    document.getElementById("destinationdeliverycharges").value = destinationdeliverycharges.toFixed(2);
    document.getElementById("destinationcfscharges").value = destinationcfscharges.toFixed(2);
    document.getElementById("destinationCharges").value = destinationCharges.toFixed(2);
    document.getElementById("submittedCBM").value = cbm.toFixed(2);
    document.getElementById("submittedWeight").value = weight;

    const formData = new FormData(this);

    let success = false;
    try {
        const res = await fetch(this.action, {
            method: this.method,
            body: formData,
            headers: { "Accept": "application/json" }
        });
        success = res.ok;
    } catch (e) {
        success = false;
    }

    showResult(location, cargo, originCharges, destinationdeliverycharges, destinationcfscharges, destinationCharges, success);

    if (success) this.reset();
});

/* ------------------- RESULT DISPLAY ------------------- */
function showResult(location, cargo, originCharges, delivery, cfs, totalDest, success) {
    const t = translations[currentLang];
    const result = document.getElementById("resultBox");

    result.style.display = "block";
    result.innerHTML = `
        <h3>${t.locationOptions[location]} - ${t.cargoOptions[cargo]}</h3>
        <p><strong>${t.totalOrigin}</strong> ${originCharges.toFixed(2)}</p>
        <p><strong>${t.destinationdeliverycharges}</strong> ${delivery.toFixed(2)}</p>
        <p><strong>${t.destinationcfscharges}</strong> ${cfs.toFixed(2)}</p>
        <p><strong>${t.totalDest}</strong> ${totalDest.toFixed(2)}</p>
        <p>${t.note}</p>
        <p>${t.excl}</p>
        <p>${t.check}</p>
        <p style="color:${success ? 'green' : 'red'}">${success ? t.success : t.fail}</p>
    `;
}
</script>

</body>
</html>
